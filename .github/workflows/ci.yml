name: CI

# Builds and tests on every push to main and every pull request.

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build App
        run: make app
      - name: Zip App
        run: zip -r Eskele.app.zip .build/out/Products/Release/Eskele.app
      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eskele.app
          path: Eskele.app.zip
